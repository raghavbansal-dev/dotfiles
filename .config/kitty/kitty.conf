# ~/.config/kitty/kitty.conf
# Kitty terminal config — matches Neovim (tokyonight-night).
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# ─────────────────────────────────────────────
# Font
# ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Render box-drawing/powerline chars crisply
disable_ligatures never

# ─────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────
cursor_shape           block
# Disable cursor blink (0 = no blink)
cursor_blink_interval  0

# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────
scrollback_lines 10000

# ─────────────────────────────────────────────
# Mouse
# ─────────────────────────────────────────────
mouse_hide_wait 3.0
copy_on_select  no

# ─────────────────────────────────────────────
# Bell — off (no audible/visual bell)
# ─────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0

# ─────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────
remember_window_size  yes
window_padding_width  8
# Don't nag when closing the window
confirm_os_window_close 0

# Hide the title bar / use a clean look (comment out if you want decorations)
# hide_window_decorations yes

# ─────────────────────────────────────────────
# Tabs
# ─────────────────────────────────────────────
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted

# ─────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# ─────────────────────────────────────────────
# Theme: Catppuccin Mocha (vibrant pastels on warm dark)
# ─────────────────────────────────────────────
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc

# Cursor colors
cursor                #f5e0dc
cursor_text_color     #1e1e2e

# URL underline color when hovering
url_color             #f5e0dc

# Window borders
active_border_color   #b4befe
inactive_border_color #6c7086

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# Normal colors (0-7)
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

# Bright colors (8-15)
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
