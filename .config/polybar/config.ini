;═══════════════════════════════════════════
; Tokyo Night flight-console polybar
;═══════════════════════════════════════════

[colors]
bg       = #16161e
bg-alt   = #1a1b26
fg       = #c0caf5
fg-dim   = #565f89
accent   = #7aa2f7
cyan     = #7dcfff
green    = #9ece6a
amber    = #e0af68
red      = #f7768e
purple   = #bb9af7

[bar/main]
width        = 100%
height       = 40
radius       = 0
background    = ${colors.bg}
foreground    = ${colors.fg}
line-size     = 2
padding-left  = 1
padding-right = 2
module-margin = 1
font-0 = "JetBrainsMono Nerd Font:size=14;3"
font-1 = "JetBrainsMono Nerd Font:size=16;4"
modules-left   = i3
modules-center = date
modules-right  = net vol disk updates uptime
cursor-click   = pointer
enable-ipc     = true

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2

label-focused = %index%  %name%
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.bg}
label-urgent-background = ${colors.red}
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %{F#c0caf5}%H:%M%{F-}  %{F#565f89}·%{F-}  %{F#7dcfff}%a %d%{F-}
date-alt = %{F#c0caf5}%H:%M:%S%{F-}  %{F#565f89}·%{F-}  %{F#7dcfff}%A %d %b%{F-}
label = %date%

[module/net]
type = internal/network
interface-type = wired
interval = 3
label-connected = %{F#565f89}NET%{F-} %{F#9ece6a}▲▼%{F-}
label-disconnected = %{F#565f89}NET%{F-} %{F#f7768e}✕%{F-}

[module/vol]
type = internal/pulseaudio
interval = 3
format-volume = %{F#565f89}VOL%{F-} <label-volume>
label-volume = %percentage%
label-volume-foreground = ${colors.fg}
label-muted = %{F#565f89}VOL%{F-} %{F#f7768e}mute%{F-}

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
label-mounted = %{F#565f89}DISK%{F-} %percentage_used%%
label-mounted-foreground = ${colors.fg}

[module/updates]
type = custom/script
exec = checkupdates 2>/dev/null | wc -l
interval = 600
label = %{F#565f89}UPD%{F-} %{F#e0af68}%output%%{F-}

[module/uptime]
type = custom/script
exec = ~/.config/polybar/uptime.sh
interval = 60
label = %{F#565f89}UP%{F-} %output%

[settings]
screenchange-reload = true
pseudo-transparency = false
