# ~/.config/starship.toml
# Starship prompt config — Catppuccin Mocha palette (matches Kitty terminal).
# Docs: https://starship.rs/config/

# Use the Catppuccin Mocha palette defined at the bottom.
palette = "catppuccin_mocha"

# ─────────────────────────────────────────────
# Prompt format — order of modules left to right
# ─────────────────────────────────────────────
format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
$git_status\
[](fg:green bg:teal)\
$c\
$python\
$rust\
$java\
[](fg:teal bg:blue)\
$nodejs\
[](fg:blue bg:surface0)\
$cmd_duration\
[ ](fg:surface0)\
$line_break\
$character"""

# ─────────────────────────────────────────────
# OS / starting segment
# ─────────────────────────────────────────────
[os]
disabled = false
style = "bg:surface0 fg:text"

[os.symbols]
Ubuntu = "󰕈 "
Debian = "󰣚 "
Arch = "󰣇 "
Fedora = "󰣛 "
Linux = " "

[username]
show_always = false
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = '[ $user]($style)'

# ─────────────────────────────────────────────
# Directory
# ─────────────────────────────────────────────
[directory]
style = "fg:crust bg:peach"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ─────────────────────────────────────────────
# Git
# ─────────────────────────────────────────────
[git_branch]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:green fg:crust"
format = '[$all_status$ahead_behind ]($style)'

# ─────────────────────────────────────────────
# Languages (only show when relevant files present)
# ─────────────────────────────────────────────
[c]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:teal fg:crust"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:blue fg:crust"
format = '[ $symbol ($version) ]($style)'

# ─────────────────────────────────────────────
# Command duration (shows if a command took a while)
# ─────────────────────────────────────────────
[cmd_duration]
min_time = 2000
style = "bg:surface0 fg:text"
format = '[  $duration ]($style)'

# ─────────────────────────────────────────────
# The prompt character (changes color on error)
# ─────────────────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

# ─────────────────────────────────────────────
# Catppuccin Mocha palette
# ─────────────────────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"
