maroon    = "#f7768e"
peach     = "#e0af68"
yellow    = "#e0af68"
green     = "#9ece6a"
teal      = "#7dcfff"
sky       = "#7dcfff"
sapphire  = "#7aa2f7"
blue      = "#7aa2f7"
lavender  = "#bb9af7"
