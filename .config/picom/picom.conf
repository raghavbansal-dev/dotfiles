#═══════════════════════════════════════════
# picom — Tokyo Night flight console
# Tuned for software rendering (no GPU)
#═══════════════════════════════════════════

# ── Backend ──
# xrender is lighter than glx for GPU-less VMs
backend = "xrender";
vsync = true;

# ── Rounded corners ──
corner-radius = 10;
# don't round these (no corners on bar/borders)
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "window_type = 'desktop'"
];

# ── Transparency ──
# focused windows fully opaque, unfocused slightly dimmed
active-opacity   = 1.0;
inactive-opacity = 0.92;
frame-opacity    = 1.0;

# terminal-specific transparency (the HUD-glass look)
opacity-rule = [
  "92:class_g = 'konsole' && focused",
  "85:class_g = 'konsole' && !focused"
];

# don't make these transparent
focus-exclude = [
  "class_g = 'Polybar'"
];

# ── Fading ──
fading = false;
fade-in-step  = 0.02;
fade-out-step = 0.02;
fade-delta    = 8;

# fade these
fade-exclude = [ ];

# ── Shadows (subtle, optional) ──
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ── Misc ──
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = false;
